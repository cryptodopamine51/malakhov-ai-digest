name: Telegram Weekly Report Primary

on:
  schedule:
    # 08:20 UTC = 11:20 Moscow. Sole production primary after the VPS
    # cutover; the former pg_cron job is intentionally absent.
    - cron: '20 8 * * 1'
  workflow_dispatch:
    inputs:
      send:
        description: 'Actually send for a manual dispatch (default is dry-run/no-send)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: telegram-weekly-report-delivery
  cancel-in-progress: false

jobs:
  primary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production code
        uses: actions/checkout@v4
        with:
          # Scheduled workflows are sourced from main, while this production
          # line remains the deployed weekly-report payload.
          ref: codex/prod-release-2026-06-17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Manual dry-run
        if: github.event_name == 'workflow_dispatch' && inputs.send != true
        run: npm run tg-weekly-report -- --dry-run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://news.malakhovai.ru

      - name: Run weekly report primary
        if: github.event_name == 'schedule' || inputs.send == true
        run: npx tsx scripts/run-tg-weekly-report-backup.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_WEEKLY_REPORT_FORMAT: business
          NEXT_PUBLIC_SITE_URL: https://news.malakhovai.ru
          NEXT_PUBLIC_TELEGRAM_CHANNEL_URL: https://t.me/malakhovAIdigest
