name: Telegram Channel Post Primary

on:
  schedule:
    # Sole production primary after the VPS cutover. No pg_cron/systemd
    # Telegram channel-post scheduler may run alongside this workflow.
    - cron: '35 6 * * *'
    - cron: '35 9 * * *'
    - cron: '35 12 * * *'
    - cron: '35 15 * * *'
    - cron: '5 18 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Optional slot 1..5; empty uses current Moscow time'
        required: false
        type: string
      send:
        description: 'Actually send for a manual dispatch (default is test-only/no-send)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: telegram-channel-post-delivery
  cancel-in-progress: false

jobs:
  primary:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitHub schedules are read from main; keep the current channel
          # production payload pinned until that release line is merged.
          ref: codex/evergreen-quality-standard-2026-05-21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Manual no-send validation
        if: github.event_name == 'workflow_dispatch' && inputs.send != true
        run: npx tsx --test tests/node/channel-post.test.ts tests/node/tg-channel-schedule.test.ts

      - name: Run Telegram channel post primary
        if: github.event_name == 'schedule' || inputs.send == true
        run: npm run tg-channel-post:backup
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          TG_CHANNEL_POST_SLOT: ${{ github.event.inputs.slot }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          NEXT_PUBLIC_SITE_URL: https://news.malakhovai.ru
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DEEPSEEK_TELEGRAM_CAPTION_MODEL: deepseek-v4-flash
          DEEPSEEK_TELEGRAM_CAPTION_DAILY_BUDGET_USD: '0.05'
